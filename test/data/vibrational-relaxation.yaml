reactions:
# Reaction 0:
# Constant relaxation model for a lumped N2 vibrational energy reservoir
- equation: N2(v) + N2 => N2 + N2
  type: constant-vibrational-relaxation
  rate-constant: {A: 1e10}

# Reaction 1:
# Starikovskiy relaxation model for a lumped N2 vibrational energy reservoir
- equation: N2(v) + O => N2 + O
  type: Starikovskiy-vibrational-relaxation
  rate-constant: {A: 6.0221407600e+23, b: 1.0, C0: -34.03, C13: -33.11, Cm: 0.0, m: 1.0, Cn: 0.0, n: 1.0}

# Reaction 2:
# Castela relaxation model for a lumped N2 vibrational energy reservoir
- equation: N2(v) + O2 => N2 + O2
  type: Castela-vibrational-relaxation
  rate-constant: {a: 229.0, b: 0.0295, reference-pressure: 1 atm}

# Reaction 3:
# State resolved vibrational relaxation model for N2(v1) to ground N2.
- equation: N2(v1) + O => N2 + O
  type: multi-state-resolved-vibrational-relaxation
  rate-constant: {A: 6.02e+23, b: 1.0, C0: -34.03, C13: 33.11, C23: 0.0}